[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnimind"
version = "0.10.0"
description = "OmniMind - an autonomous, self-evolving AI operating system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",  # optional: PostgresFleetStorage (M8)
    "scikit-learn>=1.3",    # optional: ML failure predictor (M5b)
    "nats-py>=2.7",         # optional: NatsBus fleet message bus (M8+)
]

[project.scripts]
omnimind = "omni.cli:main_entry"

[tool.setuptools.packages.find]
include = ["omni*"]

[tool.setuptools.package-data]
omni = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
