name: Keep backend warm

# Render's free tier spins the service down after ~15 minutes idle; the
# next request then eats a 30-60s cold start, which is what breaks the
# Mission Control live feed and the chat's first message. Pinging on a
# schedule keeps it warm without needing a paid Render plan.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the control plane
        run: curl -sf --max-time 20 https://api.origox.xyz/ -o /dev/null
