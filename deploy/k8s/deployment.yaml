apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimind
  namespace: omnimind
  labels:
    app: omnimind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnimind
  template:
    metadata:
      labels:
        app: omnimind
    spec:
      containers:
        - name: omnimind
          image: omnimind:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: omnimind-config
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omnimind-data
