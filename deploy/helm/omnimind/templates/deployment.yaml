apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-omnimind
  labels:
    app: omnimind
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: omnimind
  template:
    metadata:
      labels:
        app: omnimind
    spec:
      containers:
        - name: omnimind
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: OMNIMIND_DB
              value: /data/omnimind.db
            - name: OMNIMIND_LOG_LEVEL
              value: {{ .Values.env.OMNIMIND_LOG_LEVEL }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-omnimind-data
